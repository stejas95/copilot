<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Journal - Daily Journal with Mood Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="journal">
  <!-- Navigation -->
  <nav>
    <div class="navbar">
      <div class="navbar-brand">
        📔 Journal Mood Tracker
      </div>
      <ul class="navbar-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="journal.html" class="active">My Journal</a></li>
        <li><a href="add.html">Add Entry</a></li>
        <li><button class="dark-mode-toggle" title="Toggle dark mode">🌙</button></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main>
    <div class="container">
      <!-- Header -->
      <section class="journal-header">
        <h1>📖 My Journal Entries</h1>
        <div class="search-bar">
          <input
            type="text"
            class="search-input"
            placeholder="Search entries..."
            aria-label="Search journal entries"
          >
        </div>
      </section>

      <!-- Filters -->
      <section class="filters">
        <button class="filter-btn active" data-mood="all">All Entries</button>
        <button class="filter-btn" data-mood="happy">😊 Happy</button>
        <button class="filter-btn" data-mood="excited">🤩 Excited</button>
        <button class="filter-btn" data-mood="neutral">😐 Neutral</button>
        <button class="filter-btn" data-mood="sad">😢 Sad</button>
        <button class="filter-btn" data-mood="angry">😡 Angry</button>
        <button class="filter-btn" data-mood="tired">😴 Tired</button>
      </section>

      <!-- Entries Grid -->
      <section class="entries-container"></section>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
