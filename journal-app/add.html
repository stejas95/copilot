<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Journal Entry - Daily Journal with Mood Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="add">
  <!-- Navigation -->
  <nav>
    <div class="navbar">
      <div class="navbar-brand">
        📔 Journal Mood Tracker
      </div>
      <ul class="navbar-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="journal.html">My Journal</a></li>
        <li><a href="add.html" class="active">Add Entry</a></li>
        <li><button class="dark-mode-toggle" title="Toggle dark mode">🌙</button></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main>
    <div class="add-page-container">
      <!-- Page Title -->
      <h1>✏️ Add New Journal Entry</h1>

      <!-- Mood Chart -->
      <div class="mood-chart-container">
        <h3>Mood Distribution</h3>
        <div class="mood-chart"></div>
      </div>

      <!-- Form -->
      <form id="journalForm">
        <!-- Date Input -->
        <div class="form-group">
          <label for="entryDate">📅 Date</label>
          <input
            type="date"
            id="entryDate"
            required
            aria-label="Entry date"
          >
        </div>

        <!-- Mood Selector -->
        <div class="form-group">
          <label>😊 How are you feeling?</label>
          <div class="mood-selector-container"></div>
        </div>

        <!-- Text Area -->
        <div class="form-group">
          <label for="entryText">📝 What's on your mind?</label>
          <textarea
            id="entryText"
            placeholder="Write your thoughts, feelings, and experiences here..."
            required
            aria-label="Journal entry text"
          ></textarea>
        </div>

        <!-- Action Buttons -->
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-submit">Save Entry</button>
          <a href="journal.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Handle form submission
    const form = document.getElementById('journalForm');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const submitBtn = form.querySelector('.btn-submit');
        submitBtn.click();
      });
    }
  </script>
</body>
</html>
